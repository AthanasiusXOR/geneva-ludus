---
# Wittenberg: configure the Linux attack/operator host (linattack1).
- name: Configure Linux attack host
  hosts: linattack
  become: true
  vars:
    lin_user: "{{ local_linux_user }}"
    operator_ssh_pubkey: "{{ lookup('file', 'files/lin_key.pub') }}"
  tasks:
    - name: Ensure operator home .ssh exists
      file:
        path: "/home/{{ lin_user }}/.ssh"
        state: directory
        owner: "{{ lin_user }}"
        group: "{{ lin_user }}"
        mode: "0700"

    - name: Install operator SSH public key
      authorized_key:
        user: "{{ lin_user }}"
        key: "{{ operator_ssh_pubkey }}"
        state: present

    - name: Drop lab notes for operator
      copy:
        dest: "/home/{{ lin_user }}/RANGE-NOTES.md"
        owner: "{{ lin_user }}"
        group: "{{ lin_user }}"
        mode: "0644"
        content: |
          # Wittenberg — operator notes

          - Ludus host: reformation
          - This range user: WITTENBERG
          - Teamshare: //10.RANGE_NUMBER.30.1/share (or /mnt/share on teamshare)
          - Power only ONE target cell at a time (~60 GB host shared with GENEVA)
          - Ollama is the separate GENEVA range (not on this VLAN)
            WireGuard into GENEVA, then: curl http://10.<GENEVA_RANGE#>.10.10:11434/api/tags
            Model: rt-assist

    - name: Remind operator to fix placeholders in notes
      debug:
        msg: "Edit /home/{{ lin_user }}/RANGE-NOTES.md — replace RANGE_NUMBER and GENEVA_RANGE#."
