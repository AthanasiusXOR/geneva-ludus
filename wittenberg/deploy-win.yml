---
- name: Verify Active Directory (Ludus already promotes DCs)
  hosts: dcs
  gather_facts: false
  tasks:
    - include_tasks: tasks/deploy-ad.yml
      vars:
        domain_config: "{{ domains[domain_key] }}"

- name: Deploy placeholder implant artifact on workstations
  hosts: workstations
  gather_facts: false
  tasks:
    - name: Ensure 7-Zip Program Files path exists
      ansible.windows.win_file:
        path: 'C:\Program Files\7-Zip'
        state: directory

    - name: Drop placeholder "beacon" next to 7-Zip
      ansible.windows.win_copy:
        content: |
          Placeholder implant artifact for lab scenarios.
          Replace with your real test payload when ready.
        dest: 'C:\Program Files\7-Zip\7zCon.exe'

- name: Deploy placeholder workstation persistence service
  hosts: workstations
  gather_facts: false
  tasks:
    - name: Register 7ZCon service (points at placeholder)
      ansible.windows.win_service:
        name: 7ZCon
        path: 'C:\Program Files\7-Zip\7zCon.exe'
        display_name: 7-Zip Configuration Monitor
        description: Monitors the active configuration of 7-Zip to ensure functionality
        start_mode: manual
        state: stopped
      failed_when: false

- name: Deploy DC cohab listener
  hosts: dcs
  gather_facts: false
  tasks:
    - include_tasks: tasks/win-cohab.yml
  vars:
    tcp_port: 80
    cohab_fullpath: 'C:\windows\system32\svcghost.exe'
    cohab_name: svcghost
    cohab_desc: Lab cohab listener on DCs

- name: Deploy workstation cohab listener
  hosts: workstations
  gather_facts: false
  tasks:
    - include_tasks: tasks/win-cohab.yml
  vars:
    tcp_port: 49201
    cohab_fullpath: 'C:\windows\system32\vsss.exe'
    cohab_name: vsss
    cohab_desc: Lab cohab listener on workstations
