---
# Geneva Ansible inventory (Ollama range).
# Stamp RANGE_NUMBER: ./stamp-range-number.sh
#
# Try debian/debian first (classic Ludus Debian). If UNREACHABLE, use localuser/password.
all:
  children:
    ollama_hosts:
      hosts:
        ollama:
          ansible_host: 10.RANGE_NUMBER.10.10
      vars:
        ansible_user: localuser
        ansible_password: password
        ansible_become_password: password
