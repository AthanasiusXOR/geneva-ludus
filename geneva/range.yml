defaults:
  snapshot_with_RAM: false
  stale_hours: 0
  ad_domain_functional_level: "WinThreshold"
  ad_forest_functional_level: "WinThreshold"
  ad_domain_admin: domainadmin
  ad_domain_admin_password: password
  ad_domain_user: domainuser
  ad_domain_user_password: password
  ad_domain_safe_mode_password: password
  timezone: America/Denver
  enable_dynamic_wallpaper: true

network:
  inter_vlan_default: REJECT
  external_default: ACCEPT
  wireguard_vlan_default: ACCEPT
  always_blocked_networks:
    - 192.168.1.0/24
    - 192.168.0.0/24
  rules:
    - name: Allow ansible to attack VLAN
      vlan_src: 40
      vlan_dst: 30
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow ansible to redirs
      vlan_src: 40
      vlan_dst: 20
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow ansible to GOAD
      vlan_src: 40
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow GOAD to redirs
      vlan_src: 10
      vlan_dst: 20
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow attack to redirs
      vlan_src: 30
      vlan_dst: 20
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow redirs to attack
      vlan_src: 20
      vlan_dst: 30
      protocol: all
      ports: all
      action: ACCEPT
    - name: Allow attack to GOAD
      vlan_src: 30
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT
