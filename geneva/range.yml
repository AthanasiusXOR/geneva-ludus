# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# Geneva — red-team Ollama range on Ludus host "reformation"
#
# Deploy as Ludus user GENEVA:
#   ludus --user GENEVA range config set -f range.yml
#   ludus --user GENEVA range deploy
#
# AFTER models are pulled, flip block_internet to true (see README) so the VM
# cannot reach the public internet. Lab/WireGuard clients can still hit :11434.
#
ludus:
  - vm_name: "ollama"
    hostname: "ollama"
    template: debian-13-x64-server-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 16
    cpus: 8
    linux: true
    testing:
      snapshot: true
      # false while installing/pulling models; set true after deploy-ollama.yml
      block_internet: false

defaults:
  snapshot_with_RAM: false
  stale_hours: 0
  timezone: America/Denver
  enable_dynamic_wallpaper: true

network:
  inter_vlan_default: REJECT
  # ACCEPT until model pull is done; optionally set REJECT after lockdown
  external_default: ACCEPT
  wireguard_vlan_default: ACCEPT
  always_blocked_networks:
    - 192.168.1.0/24
    - 192.168.0.0/24
  rules: []
