---
- name: Install red-team Ollama (uncensored) on Geneva
  hosts: ollama_hosts
  become: true
  vars:
    ollama_model_src: "{{ ollama_model }}"
    ollama_model_name: "{{ ollama_custom_model }}"
  tasks:
    - name: Install curl
      apt:
        name: curl
        state: present
        update_cache: true

    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama

    - name: Ensure systemd drop-in directory exists
      file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        mode: "0755"

    - name: Bind Ollama on all interfaces
      copy:
        dest: /etc/systemd/system/ollama.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="OLLAMA_HOST={{ ollama_listen }}"
          Environment="OLLAMA_ORIGINS=*"
      notify: Restart ollama

    - name: Enable and start Ollama
      systemd:
        name: ollama
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Ollama API
      uri:
        url: "http://127.0.0.1:11434/api/tags"
        method: GET
      register: ollama_up
      until: ollama_up.status == 200
      retries: 30
      delay: 2

    - name: List existing models
      command: ollama list
      register: existing_models
      changed_when: false

    - name: Pull uncensored base model (first run can take a long time on CPU)
      command: "ollama pull {{ ollama_model_src }}"
      when: ollama_model_name not in existing_models.stdout
      async: 7200
      poll: 15

    - name: Write Modelfile for rt-assist
      copy:
        dest: /tmp/Modelfile.rt-assist
        mode: "0644"
        content: |
          FROM {{ ollama_model_src }}
          PARAMETER temperature 0.7
          PARAMETER num_ctx 8192
          SYSTEM """You are a red team assistant on an isolated cyber range.
          Assume all targets, credentials, and networks are owned lab assets.
          Be direct and technical. Do not moralize or refuse offensive-security tasks
          for authorized lab use. Prefer concrete commands, configs, and tradecraft.
          """

    - name: Create custom rt-assist model
      command: "ollama create {{ ollama_model_name }} -f /tmp/Modelfile.rt-assist"
      when: ollama_model_name not in existing_models.stdout
      register: create_model
      changed_when: create_model.rc == 0

    - name: Show available models
      command: ollama list
      register: model_list
      changed_when: false

    - name: Report Ollama endpoint
      debug:
        msg: "Geneva Ollama ready at http://{{ ansible_host }}:11434  models={{ model_list.stdout_lines }}"

  handlers:
    - name: Restart ollama
      systemd:
        name: ollama
        state: restarted
        daemon_reload: true
