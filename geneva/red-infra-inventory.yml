---
# GENEVA operator / C2 / redirector inventory
all:
  vars:
    ansible_user: localuser
    ansible_password: password
    ansible_ssh_pass: password

services:
  hosts:
    teamshare:
      ansible_host: 10.RANGE_NUMBER.30.1
    ansible:
      ansible_host: 10.RANGE_NUMBER.40.1

c2_servers:
  hosts:
    c2server0:
      ansible_host: 10.RANGE_NUMBER.30.10
    c2server1:
      ansible_host: 10.RANGE_NUMBER.30.11

redirectors:
  hosts:
    redir-e1-0:
      ansible_host: 10.RANGE_NUMBER.20.10
    redir-w1-0:
      ansible_host: 10.RANGE_NUMBER.20.20

linattack:
  hosts:
    linattack1:
      ansible_host: 10.RANGE_NUMBER.30.21
  vars:
    ansible_user: kali
    ansible_password: kali
    ansible_ssh_pass: kali
    ansible_become_password: kali

winattack:
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_port: 5986
    ansible_user: localuser
    ansible_password: password
    ansible_winrm_server_cert_validation: ignore
  hosts:
    winattack1:
      ansible_host: 10.RANGE_NUMBER.30.31

goad:
  hosts:
    GENEVA-DC01:
      ansible_host: 10.RANGE_NUMBER.10.10
    GENEVA-DC02:
      ansible_host: 10.RANGE_NUMBER.10.11
    GENEVA-SRV02:
      ansible_host: 10.RANGE_NUMBER.10.12
    GENEVA-DC03:
      ansible_host: 10.RANGE_NUMBER.10.13
    GENEVA-SRV03:
      ansible_host: 10.RANGE_NUMBER.10.14
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_port: 5986
    ansible_user: domainadmin
    ansible_password: password
    ansible_winrm_server_cert_validation: ignore
