---
# Ludus domain: role already promotes the DC and joins members.
# This task file only verifies the domain is reachable post-deploy.
- name: Check domain FQDN is set on host vars
  debug:
    msg: "DC {{ inventory_hostname }} expected domain {{ domain_config.fqdn }} (edr={{ domain_config.edr }}, internet={{ domain_config.internet }})"

- name: Probe domain admin credential path via WinRM whoami
  ansible.windows.win_whoami:
  register: whoami
  failed_when: false

- name: Show whoami result
  debug:
    var: whoami
  when: whoami is succeeded
