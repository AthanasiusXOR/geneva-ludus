---
# Replace RANGE_NUMBER with your Ludus range number before running Ansible.
#   sed -i "s/RANGE_NUMBER/$(ludus range list --json | jq -r '.[0].rangeNumber // .rangeNumber')" inventory.yml
# Or: export RANGENUMBER=5; sed -i "s/RANGE_NUMBER/${RANGENUMBER}/g" inventory.yml red-infra-inventory.yml
all:
  children:
    target_range_win:
      children:
        dcs:
          hosts:
            D-NONE-NOINT:
              ansible_host: 10.RANGE_NUMBER.10.21
              domain_key: none_noint
            D-NONE-INT:
              ansible_host: 10.RANGE_NUMBER.11.21
              domain_key: none_int
            D-EDR-NOINT:
              ansible_host: 10.RANGE_NUMBER.10.31
              domain_key: edr_noint
            D-EDR-INT:
              ansible_host: 10.RANGE_NUMBER.11.31
              domain_key: edr_int
        workstations:
          hosts:
            W-NONE-NOINT:
              ansible_host: 10.RANGE_NUMBER.10.22
              domain_key: none_noint
            W-NONE-INT:
              ansible_host: 10.RANGE_NUMBER.11.22
              domain_key: none_int
            W-EDR-NOINT:
              ansible_host: 10.RANGE_NUMBER.10.32
              domain_key: edr_noint
            W-EDR-INT:
              ansible_host: 10.RANGE_NUMBER.11.32
              domain_key: edr_int
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_port: 5986
        ansible_user: domainadmin
        ansible_password: password
        ansible_winrm_server_cert_validation: ignore

    # No dedicated Linux *targets* in the slim range.
    # linattack1 is the Linux operator box (see attack_space / linattack).
    target_range_lin:
      hosts: {}
      vars:
        ansible_user: localuser
        ansible_password: password

    attack_space:
      children:
        teamshare_hosts:
          hosts:
            teamshare:
              ansible_host: 10.RANGE_NUMBER.30.1
        linattack:
          hosts:
            linattack1:
              ansible_host: 10.RANGE_NUMBER.30.21
        winattack:
          hosts:
            winattack1:
              ansible_host: 10.RANGE_NUMBER.30.31
          vars:
            ansible_connection: winrm
            ansible_winrm_transport: ntlm
            ansible_port: 5986
            ansible_user: localuser
            ansible_password: password
            ansible_winrm_server_cert_validation: ignore
        c2_servers:
          hosts:
            c2server0:
              ansible_host: 10.RANGE_NUMBER.30.10
              alias: cs0
            c2server1:
              ansible_host: 10.RANGE_NUMBER.30.11
              alias: my1
        ollama:
          hosts:
            ollama-rt:
              ansible_host: 10.RANGE_NUMBER.30.50
      vars:
        ansible_user: localuser
        ansible_password: password

    redirectors:
      hosts:
        redir-e1-0:
          ansible_host: 10.RANGE_NUMBER.20.10
          redirect_to: 10.RANGE_NUMBER.30.10:443
          redirect_listen_port: 443
        redir-w1-0:
          ansible_host: 10.RANGE_NUMBER.20.20
          redirect_to: 10.RANGE_NUMBER.30.11:443
          redirect_listen_port: 443
      vars:
        ansible_user: localuser
        ansible_password: password

    ansible_ctrl:
      hosts:
        ansible:
          ansible_host: 10.RANGE_NUMBER.40.1
      vars:
        ansible_user: localuser
        ansible_password: password
